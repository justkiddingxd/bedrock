[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/proto",
    "crates/sync",
    "crates/server",
    "crates/mcp",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bedrock-core = { path = "crates/core" }
bedrock-proto = { path = "crates/proto" }
bedrock-sync = { path = "crates/sync" }
bedrock-server = { path = "crates/server" }
bedrock-mcp = { path = "crates/mcp" }

anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Key derivation is slow in unoptimized builds; keep crypto fast even in dev.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
