# A GitHub release with the Windows installers and the Linux server.
# Started by hand only (Actions → Release → Run workflow, or
# `gh workflow run release.yml -f version=0.2.0`); it tags the commit v<version>.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0 (without "v")'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 1.2.3"; exit 1; }'

  desktop:
    name: Windows installers
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # The installers carry the release version.
      - run: npm run tauri build -- --config "{\"version\":\"$VERSION\"}"
        working-directory: app
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  server:
    name: Linux server
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p bedrock-server
      - run: tar -czf "bedrock-server-$VERSION-linux-x86_64.tar.gz" -C target/release bedrock-server
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: bedrock-server-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [desktop, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Bedrock ${{ inputs.version }}
          generate_release_notes: true
          files: dist/*
