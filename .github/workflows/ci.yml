# Every push to main and every pull request: tests, frontend checks, the
# Windows installers and the Linux server, kept as build artifacts (14 days).
# Nothing is published here; releases are made by release.yml on request.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The desktop app needs WebKit on Linux; it is built on Windows below.
      - run: cargo test --workspace --exclude bedrock-app

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  desktop:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Also builds the bedrock-mcp sidecar and the frontend (beforeBuildCommand).
      - run: npm run tauri build
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  server:
    name: Linux server
    # An older glibc than the build machine's would refuse the binary: 22.04 runs on Debian 12 too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p bedrock-server
      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-server-linux-x86_64
          path: target/release/bedrock-server
          if-no-files-found: error
          retention-days: 14
